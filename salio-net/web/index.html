<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes Salio installable on the tablet. Colours are tailwind.css's
         --color-primary (theme) and --color-background. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15503a" />
    <meta name="description" content="Till, stock and books together" />
    <title>Salio</title>
    <!-- Runs before React. Chrome may say "Salio can be installed" before
         the app has loaded, and that announcement is not repeated, so it is
         caught here and parked on window. src/install.ts picks it up. -->
    <script>
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.salioInstallPrompt = event;
      });
      window.addEventListener("appinstalled", function () {
        window.salioInstallPrompt = null;
        window.salioInstalled = true;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
