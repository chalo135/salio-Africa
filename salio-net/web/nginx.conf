# Serves the built till. HTTPS and /api are Caddy's job, not this server's.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Smaller downloads over a mobile connection. Caddy in front compresses
    # too, but leaves alone anything already compressed here, so nothing is
    # done twice. "any": compress for requests that come through Caddy as
    # well (off by default for proxied requests). text/html is always on.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Vite puts a content hash in every asset name, so these never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx does not know .webmanifest and would call it a download.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html names the current assets, so it must never be cached:
    # otherwise a phone keeps running last week's till after a release.
    # The same goes for sw.js (the service worker) and everything else
    # outside /assets/: the browser asks every time whether it has changed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
